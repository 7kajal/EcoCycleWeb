<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard</title>
  <link rel="icon" type="image/x-icon" href="/logo.jpg">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />

  <style>
    body {
      font-family: "Poppins", sans-serif;
    }
  </style>
</head>
<div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 flex flex-col items-center z-50">
</div>

<body class="bg-green-100 min-h-screen flex flex-col">
  <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 flex flex-col items-center z-50">
  </div>
  <main class="flex-grow my-4 flex items-center justify-center">
    <div class="max-w-4xl w-full mx-4 sm:mx-auto p-6 bg-white rounded-lg shadow-2xl text-center">
      <h2 class="text-3xl sm:text-4xl font-extrabold text-green-700 mb-6 uppercase">🏆 Leaderboard 🏆</h2>

      <div class="overflow-x-auto">
        <table class="w-full table-auto border-collapse bg-white shadow-lg rounded-lg overflow-hidden">
          <thead class="bg-green-600 text-white text-sm sm:text-lg">
            <tr>
              <th class="px-4 sm:px-6 py-2 sm:py-3 text-center font-semibold uppercase tracking-wide">Rank</th>
              <th class="px-4 sm:px-6 py-2 sm:py-3 text-center font-semibold uppercase tracking-wide">Name</th>
              <th class="px-4 sm:px-6 py-2 sm:py-3 text-center font-semibold uppercase tracking-wide">Points</th>
            </tr>
          </thead>
          <tbody id="leaderboard" class="text-center bg-white divide-y divide-gray-300 text-xs sm:text-sm md:text-lg">
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <!-- Chatbot start -->
  <div id="chat-window" class="fixed bottom-20 right-5 w-80 bg-green-500 p-4  shadow-lg rounded-md hidden">
    <div class="p-2 bg-green-500 text-white font-bold">Assistant</div>
    <div id="chat-content" class="p-2 h-48 overflow-y-auto text-sm"></div>
    <div class="flex bg-white rounded-md">
      <textarea rows="1" id="chat-input" class="w-full border-t p-2 text-sm rounded-s-md" placeholder="Ask..."
        autofocus></textarea>

      <button id="chatInput" class="px-2 py-1 text-sm text-black">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-send-horizontal">
          <path
            d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z" />
          <path d="M6 12h16" />
        </svg>
      </button>
    </div>
  </div>

  <button id="chatbot" class="fixed bottom-5 right-5 p-3 bg-green-500 text-white rounded-full shadow-lg">💬</button>
  <script src="../utils/chatbot.js" type="module"></script>

  <!-- Chatbot end -->
  <script type="module" src="./leaderBoard.js"></script>
  <script type="module" src="./navbar.js"></script>
  <script type="module" src="./footer.js"></script>
</body>

</html>
