<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Page</title>
  <link rel="stylesheet" href="../style.css" />
</head>

<body class="bg-green-100 flex items-center justify-center min-h-screen">
  <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 flex flex-col items-center z-50">
  </div>
  <div class="bg-green-50 p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Register</h2>

    <form>
      <div class="mb-4">
        <label for="username" class="block text-gray-600">Username</label>
        <input type="text" id="username" name="username"
          class="w-full px-3 py-2 border rounded-md focus:ring-green-500 focus:border-green-500 outline-none text-sm"
          placeholder="Enter a username" required autofocus />
      </div>

      <div class="mb-4">
        <label for="email" class="block text-gray-600">Email</label>
        <input type="email" id="email" name="email"
          class="w-full px-3 py-2 border rounded-md focus:ring-green-500 focus:border-green-500 outline-none text-sm"
          placeholder="Enter your email" required />
      </div>

      <div class="mb-4">
        <label for="password" class="block text-gray-600">Password</label>
        <input type="password" minlength="8" id="password" name="password"
          class="w-full px-3 py-2 border rounded-md focus:ring-green-500 focus:border-green-500 outline-none text-sm"
          placeholder="Enter a password" required />
      </div>

      <div class="mb-4">
        <label for="role" class="block text-gray-600">Role</label>
        <select id="role">
          <option value="user">User</option>
          <option value="company">Company</option>
        </select>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-green-500 text-white p-3 hover:bg-green-600">Register</button>
    </form>

    <div class="text-center mt-4">
      <p class="text-gray-600">
        Already have an account?
        <a href="./login.html" class="text-green-500 hover:text-green-700">Login</a>
      </p>
    </div>
  </div>

  <script type="module" src="./register.js"></script>
</body>

</html>
