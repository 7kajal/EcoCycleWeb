<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 flex flex-col items-center z-50">
  </div>
  <div class="bg-green-100 flex items-center justify-center min-h-screen">
    <div class="bg-green-50 p-8 rounded-lg shadow-lg w-96">
      <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Reset password</h2>

      <form>
        <div class="mb-4">
          <label for="password" class="block text-gray-600">New Password</label>
          <input type="password" id="password" name="passsword" class="w-full p-3 mt-2 border border-green-300"
            placeholder="New Password" required />
        </div>
        <div class="mb-4">
          <label for="confPassword" class="block text-gray-600">Confirm Password</label>
          <input type="password" id="confPassword" name="confPassword" class="w-full p-3 mt-2 border border-green-300"
            placeholder="Confirm Password" required />
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-green-500 text-white p-3 hover:bg-green-600">Reset
          Password</button>
      </form>
    </div>
  </div>

  <script type="module" src="./reset-password.js"></script>
</body>

</html>
