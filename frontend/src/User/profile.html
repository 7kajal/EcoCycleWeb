<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Page</title>
    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 flex flex-col items-center z-50"></div>
    <div id="profile-section" class="p-6 rounded-2xl shadow-lg w-[40%] px-auto ml-96 mt-20">
      <div id="profile-details">
        <img id="profile-image" class="w-24 h-24 rounded-full border-4 border-green-500" />
        <br />
        <h2 id="profile-name" class="capitalize text-xl font-bold mt-4 text-green-600"></h2>
        <p id="profile-email" class="font-semibold text-gray-600"></p>
      </div>

      <button class="mt-4 bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Logout</button>
    </div>

    <script type="module" src="./navbar.js" type="module"></script>
    <script type="module" src="./profile.js" type="module"></script>
    <script type="module" src="./logout.js" type="module"></script>
  </body>
</html>
