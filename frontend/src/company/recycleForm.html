<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.jpg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <title>Schedule Pickup</title>
  </head>

  <body class="bg-gray-100">
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 flex flex-col items-center z-50"></div>
    <form id="itemForm" class="max-w-md mx-auto p-8 bg-white shadow-lg rounded-xl my-16">
      <h2 class="text-2xl font-semibold text-green-600 mb-8 text-center">Schedule Pickup</h2>

      <div class="mb-6">
        <label for="date" class="block text-sm font-medium text-gray-700 mb-2">Select Date:</label>
        <input type="date" id="date" name="date" class="w-full px-4 py-2 border rounded-md focus:ring-green-500 focus:border-green-500 outline-none" />
      </div>

      <div class="mb-8">
        <label for="time" class="block text-sm font-medium text-gray-700 mb-2">Select Time:</label>
        <select id="time" class="w-full px-4 py-2 border rounded-md focus:ring-green-500 focus:border-green-500 outline-none">
          <option value="">Select Time</option>
          <option value="9am">9:00 AM</option>
          <option value="12pm">12:00 PM</option>
          <option value="3pm">3:00 PM</option>
          <option value="6pm">6:00 PM</option>
        </select>
      </div>

      <button type="submit" id="confirm" class="w-full py-3 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors">Confirm Schedule</button>
    </form>

    <script type="module" src="./recycleForm.js"></script>
    <script type="module" src="../User/navbar.js"></script>
    <script type="module" src="../User/footer.js"></script>
  </body>
</html>
